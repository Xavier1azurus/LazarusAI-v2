<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0b12">
<title>Lazarus AI</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>

<style>

:root {
    color-scheme: dark;
    --bg: #212120;
    --sidebar: #1a1a19;
    --panel: #2d2d2b;
    --panel-hover: #302f2d;
    --text: #ececea;
    --muted: #9c9b95;
    --border: #3b3a37;
    --accent: #3b68d9;
    --accent-strong: #2e53b3;
    --bubble: #2d2d2b;
    --input: #2d2d2b;
    --font-size: 16px;
    --shadow: 0 6px 28px #00000040;
    --err: #ff8a80;
    --code: #181817;
    --on-accent: #fff;
    --user-bg: #2f2e2c;
    --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}
:root[data-theme=light] {
    color-scheme: light;
    --bg: #faf9f5;
    --sidebar: #f1efe7;
    --panel: #ffffff;
    --panel-hover: #e9e6db;
    --text: #1f1e1d;
    --muted: #74726b;
    --border: #e3dfd2;
    --accent: #1d4ed8;
    --accent-strong: #1e3fae;
    --bubble: #f1efe7;
    --input: #fff;
    --shadow: 0 6px 24px #3d392b14;
    --err: #c0392b;
    --code: #efede4;
    --on-accent: #fff;
    --user-bg: #efede4;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

body {
    background: var(--bg);
    color: var(--text);
    font: var(--font-size)/1.6 Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

button, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:active:not(:disabled) { transform: scale(0.97); }
button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.logo { font-family: Newsreader, Georgia, serif; font-size: 23px; letter-spacing: 0; font-weight: 500; }
.logo i { color: var(--accent); font-style: italic; }

.app { display: flex; height: 100dvh; width: 100%; }

/* ============ SIDEBAR ============ */
.sidebar {
    position: relative;
    z-index: 10;
    width: 260px;
    min-width: 260px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px 8px;
    overflow: hidden;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    transition: width 0.25s var(--ease-smooth), min-width 0.25s var(--ease-smooth), transform 0.25s var(--ease-smooth);
}
.sidebar.collapsed { width: 64px; min-width: 64px; }

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 6px 8px;
    margin-bottom: 6px;
    border: 0;
    border-radius: 10px;
    color: var(--text);
    background: transparent;
    text-align: left;
    white-space: nowrap;
    transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
}
.brand:hover { background: var(--panel-hover); }
.brand-icon {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    color: var(--on-accent);
    font-size: 16px;
    background: var(--accent);
}

.new-chat-btn {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    margin: 0 0 2px;
    padding: 9px 10px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    text-align: left;
    font-size: 14px;
    white-space: nowrap;
    transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
}
.new-chat-btn:hover { background: var(--panel-hover); }
.new-chat-btn .nav-icon { width: 22px; text-align: center; flex: 0 0 22px; font-size: 16px; }
#newChatButton .nav-icon { color: var(--accent); }

.history-heading {
    padding: 0 10px;
    margin: 18px 0 6px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
}
.history-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.history-item { position: relative; display: flex; align-items: center; margin: 0; }
.history-open {
    flex: 1;
    min-width: 0;
    padding: 8px 34px 8px 10px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
    transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth);
}
.history-open:hover, .history-open.selected { background: var(--panel-hover); }
.history-delete {
    position: absolute;
    right: 4px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    padding: 3px 8px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth);
}
.history-item:hover .history-delete, .history-delete:focus-visible { opacity: 1; }
.history-delete:hover { color: var(--err); }
.empty-history { padding: 10px; color: var(--muted); font-size: 13px; }

.sidebar-footer {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-top: 8px;
    border-top: 1px solid var(--border);
}
.sidebar-footer .new-chat-btn { margin-bottom: 0; }
.user-info { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; min-width: 0; }
.av, .avatar {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 13px;
}
.user-details { min-width: 0; overflow: hidden; }
#who {
    display: block;
    max-width: 170px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    line-height: 1.4;
}

/* collapsed rail */
.sidebar.collapsed .brand-name,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .history-heading,
.sidebar.collapsed .history-list,
.sidebar.collapsed .user-details { display: none; }
.sidebar.collapsed .history-list { display: none; }
.sidebar.collapsed .sidebar-footer { margin-top: auto; }
.sidebar.collapsed .brand,
.sidebar.collapsed .new-chat-btn,
.sidebar.collapsed .user-info { justify-content: center; padding-left: 0; padding-right: 0; }
.sidebar.collapsed .brand { padding: 6px 0; }

/* ============ MAIN ============ */
.main {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
}

.topbar {
    position: relative;
    z-index: 1;
    height: 54px;
    flex: 0 0 54px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
}
.topbar button { background: none; border: 0; font-size: 20px; padding: 6px 8px; border-radius: 8px; transition: background-color 0.2s var(--ease-smooth); }
.topbar button:hover { background: var(--panel-hover); }

.chat-area {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    padding: 28px 16px 24px;
}
.messages { width: min(760px, 100%); margin: 0 auto; }

/* ---- welcome ---- */
.welcome {
    min-height: 52vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px 12px;
}
.welcome-logo {
    display: block;
    margin: 0 0 14px;
    color: var(--accent);
    font-size: 40px;
    line-height: 1;
    background: none;
    box-shadow: none;
}
.welcome h1 {
    margin: 0 0 8px;
    font: 500 clamp(28px, 4.2vw, 40px)/1.2 Newsreader, Georgia, serif;
    letter-spacing: -.01em;
}
.welcome p { margin: 0; color: var(--muted); font-size: 15px; }
.sug { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 24px; max-width: 620px; }
.sug button {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 15px;
    color: var(--muted);
    font-size: 13.5px;
    transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth), border-color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
}
.sug button:hover { color: var(--text); background: var(--panel-hover); }

/* ---- messages ---- -->
@keyframes appear { 
    from { 
        opacity: 0; 
        transform: translateY(8px) scale(0.99); 
    } 
    to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
    } 
}

.message {
    display: flex;
    gap: 13px;
    align-items: flex-start;
    margin-bottom: 26px;
    animation: appear 0.25s var(--ease-smooth) forwards;
}

.message.user { justify-content: flex-end; }
.message.user .message-content {
    max-width: min(82%, 600px);
    padding: 10px 16px;
    border-radius: 20px;
    background: var(--user-bg);
    white-space: pre-wrap;
    word-break: break-word;
}

.message.ai .message-content { flex: 1; min-width: 0; line-height: 1.75; }
.message-content p { margin: 0 0 .85em; }
.message-content p:last-child { margin-bottom: 0; }
.message-content pre {
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.55;
}
.message-content pre code { background: transparent; padding: 0; font-size: inherit; }
.message-content pre code.hljs { background: transparent; padding: 0; }
.message-content code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .9em; }
.message-content :not(pre) > code { background: var(--code); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); }
.message-content ul, .message-content ol { padding-left: 22px; margin: 0 0 .85em; }
.message-content li { margin: .2em 0; }
.message-content h3, .message-content h2, .message-content h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 500;
    font-size: 1.3em;
    margin: 1em 0 .4em;
}

.error-note { color: var(--err); font-size: 13px; border-left: 2px solid var(--err); padding-left: 10px; margin-top: 8px; }

.dots::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 2px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 11px 0 var(--accent), 22px 0 var(--accent);
    animation: pulse 1s var(--ease-smooth) infinite alternate;
}
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@keyframes p { from { opacity: .6; } to { opacity: 1; } }

.act { display: flex; gap: 2px; margin-top: 8px; margin-left: -8px; }
.ab {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 0;
    color: var(--muted);
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 12.5px;
    transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth);
}
.ab:hover { background: var(--panel-hover); color: var(--text); }
.ab.on { color: var(--accent); background: var(--panel-hover); }

/* ---- attachments ---- */
#thumbs { max-width: 760px; margin: 0 auto 8px; display: flex; gap: 10px; flex-wrap: wrap; padding: 0 6px; }
.th { position: relative; width: 60px; height: 60px; }
.th img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); }
.th button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 11px; line-height: 20px; padding: 0; }
.imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.imgs img { max-width: 220px; max-height: 220px; border-radius: 12px; object-fit: cover; display: block; }

#spkbar { max-width: 760px; margin: 0 auto 8px; text-align: center; }
#spkbar button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 6px 16px; font-size: 13px; transition: background-color 0.2s var(--ease-smooth), border-color 0.2s var(--ease-smooth); }
#spkbar button:hover { border-color: var(--accent); }

/* ============ COMPOSER ============ */
.composer-wrap {
    position: relative;
    z-index: 1;
    padding: 0 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(transparent, var(--bg) 24%);
}
.composer {
    width: min(760px, 100%);
    margin: 0 auto;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--panel);
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-end;
    gap: 4px;
    transition: border-color 0.25s var(--ease-smooth), box-shadow 0.25s var(--ease-smooth);
}
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }

#messageInput {
    flex: 1;
    background: none;
    border: 0;
    outline: 0;
    padding: 8px 6px;
    color: var(--text);
    resize: none;
    max-height: 180px;
    line-height: 1.5;
}
#messageInput::placeholder { color: var(--muted); }

.ib {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    background: none;
    color: var(--muted);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth);
}
.ib:hover { color: var(--text); background: var(--panel-hover); }
.ib.on { color: var(--on-accent); background: var(--accent); }
#mic.on { animation: p 1s var(--ease-smooth) infinite alternate; }

.send-button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    color: var(--on-accent);
    background: var(--accent);
    font-size: 17px;
    font-weight: 600;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: background-color 0.2s var(--ease-smooth);
}
.send-button:hover:not(:disabled) { background: var(--accent-strong); }
.send-button:disabled { opacity: .35; cursor: default; }

.small-note { margin: 8px 0 0; color: var(--muted); text-align: center; font-size: 12px; }

/* ============ AUTH ============ */
#auth { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 99; padding: 20px; }
#auth form { width: 100%; max-width: 370px; display: flex; flex-direction: column; gap: 12px; }
#auth .logo { font-size: 40px; text-align: center; }
#auth p.s { text-align: center; color: var(--muted); margin: -4px 0 8px; font-size: 14px; }
#auth input { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font: inherit; }
#auth input:focus { border-color: var(--accent); outline: none; }
#auth .go { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 12px; font-weight: 600; transition: background-color 0.2s var(--ease-smooth); }
#auth .go:hover { background: var(--accent-strong); }
#auth .alt { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px; transition: color 0.2s var(--ease-smooth); }
#auth .alt:hover { color: var(--text); }
#err { color: var(--err); min-height: 20px; font-size: 13px; text-align: center; }

/* ============ SETTINGS ============ */
#set { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; z-index: 12; padding: 20px; backdrop-filter: blur(2px); transition: opacity 0.3s var(--ease-smooth); }
#set .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); animation: modalAppear 0.3s var(--ease-smooth) forwards; }
@keyframes modalAppear {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
#set .row { display: flex; justify-content: space-between; align-items: center; }
#set h2 { margin: 0; font: 500 24px Newsreader, Georgia, serif; }
#set .row button { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 4px 8px; border-radius: 8px; transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth); }
#set .row button:hover { background: var(--panel-hover); color: var(--text); }
#set label { color: var(--muted); font-size: 13px; margin-top: 6px; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; background: none; border: 0; padding: 8px; color: var(--muted); font-size: 13px; transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth); }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel-hover); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.nrow { display: flex; gap: 8px; }
#dn { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; color: var(--text); font: inherit; }
#dn:focus { border-color: var(--accent); outline: none; }
#dsave, #asave { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 8px 16px; font-weight: 600; transition: background-color 0.2s var(--ease-smooth); }
#dsave:hover, #asave:hover { background: var(--accent-strong); }
#dmsg { min-height: 20px; font-size: 13px; color: var(--muted); }
#dmsg.bad { color: var(--err); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; color: var(--muted); font-size: 13px; transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth); }
.chips button:hover { color: var(--text); background: var(--panel-hover); }
.chips button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#about { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; color: var(--text); font: inherit; resize: vertical; min-height: 72px; outline: none; }
#about:focus { border-color: var(--accent); }
.nrow2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#amsg { font-size: 13px; color: var(--muted); }
#amsg.bad { color: var(--err); }

/* ============ VOICE MODE ============ */
#voiceMode {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    background: #171716;
    color: #f2f1ee;
    text-align: center;
    transition: opacity 0.3s var(--ease-smooth);
}
#voiceMode.active { display: flex; }
#voiceMode h2 { font: 500 28px Newsreader, Georgia, serif; margin: 0; }
#voiceMode .voice-orb {
    width: min(60vw, 240px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #dbe6ff, #90b0f5 16%, #3b68d9 42%, #1b3a8a 72%, #0b1230 100%);
    box-shadow: 0 0 50px #3b68d966, inset -12px -15px 30px #0d1a45;
    transition: box-shadow 0.3s var(--ease-smooth), transform 0.3s var(--ease-smooth);
}
@keyframes lazarusPulse { 
    0% { transform: scale(0.95); } 
    50% { transform: scale(1.04); } 
    100% { transform: scale(0.98); } 
}
#voiceMode.listening .voice-orb { animation: lazarusPulse 2s var(--ease-smooth) infinite; box-shadow: 0 0 80px #3b68d9aa; }
#voiceMode.speaking .voice-orb { animation: lazarusPulse 1s var(--ease-smooth) infinite; box-shadow: 0 0 90px #90b0f5bb; }
#voiceMode .voice-status { min-height: 24px; color: #9fb8f2; margin: 0; }
#voiceMode .voice-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
#voiceMode button {
    border: 1px solid #4a4743;
    border-radius: 999px;
    padding: 11px 19px;
    color: #f2f1ee;
    background: #2a2927;
    font: inherit;
    cursor: pointer;
    transition: border-color 0.2s var(--ease-smooth);
}
#voiceMode button:hover { border-color: #3b68d9; }
#voiceMode .voice-close { position: absolute; top: 20px; left: 20px; }

/* ============ STUDY MODE ============ */
#studyView { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 18px; background: var(--bg); }
.study-inner { width: min(850px, 100%); margin: 0 auto; }
.study-heading { margin-bottom: 24px; }
.study-heading h1 { font: 500 clamp(30px, 5vw, 40px) Newsreader, Georgia, serif; margin: 0 0 8px; }
.study-heading p { color: var(--muted); margin: 0; }
.study-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 18px; padding: 5px; border: 1px solid var(--border); border-radius: 16px; background: var(--sidebar); }
.study-tab { min-width: 0; padding: 10px 5px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; transition: background-color 0.2s var(--ease-smooth), color 0.2s var(--ease-smooth); }
.study-tab:hover { color: var(--text); }
.study-tab.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 4px #00000030; }
.study-panel { padding: clamp(16px, 3vw, 26px); border: 1px solid var(--border); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
.study-panel h2 { font: 500 26px Newsreader, Georgia, serif; margin: 0 0 8px; }
.study-description { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.study-panel label { font-size: 13px; color: var(--muted); }
.study-field { width: 100%; display: block; resize: vertical; min-height: 105px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--text); font: inherit; margin: 6px 0 12px; }
.study-field:focus { outline: none; border-color: var(--accent); }
.study-primary { border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); padding: 10px 20px; font-weight: 600; transition: background-color 0.2s var(--ease-smooth); }
.study-primary:hover:not(:disabled) { background: var(--accent-strong); }
.study-primary:disabled { opacity: .55; cursor: wait; }
.study-result { margin-top: 20px; line-height: 1.8; overflow-wrap: anywhere; }
.study-result:empty { display: none; }
.study-result:empty + .study-flashcards { display: none; }
.study-flashcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 18px; }
.study-flashcard { min-height: 145px; padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg); color: var(--text); text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; transition: border-color 0.2s var(--ease-smooth); }
.study-flashcard:hover { border-color: var(--accent); }
.study-flashcard small { display: block; color: var(--accent); margin-bottom: 12px; }
.study-status { color: var(--muted); font-size: 13px; margin-top: 12px; }

/* quizzes */
.quiz-progress { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 20px 0 10px; color: var(--muted); font-size: 13px; }
.quiz-progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: var(--border); margin-bottom: 20px; }
.quiz-progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 0.4s var(--ease-smooth); }
.quiz-question { font: 500 22px/1.45 Newsreader, Georgia, serif; margin: 16px 0; }
.quiz-options { display: grid; gap: 10px; margin: 16px 0; }
.quiz-option { width: 100%; padding: 13px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--text); text-align: left; font: inherit; cursor: pointer; transition: border-color 0.2s var(--ease-smooth), background-color 0.2s var(--ease-smooth); }
.quiz-option:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-hover); }
.quiz-option:disabled { cursor: default; opacity: .92; }
.quiz-option.correct { border-color: #4caf7d; background: #4caf7d1c; }
.quiz-option.incorrect { border-color: #e5696f; background: #e5696f1c; }
.quiz-feedback { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; line-height: 1.6; background: var(--bg); }
.quiz-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
.quiz-score { color: var(--muted); font-size: 14px; }
.quiz-answer-input { width: 100%; min-height: 95px; resize: vertical; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--text); font: inherit; margin-bottom: 10px; }
.quiz-answer-input:focus { outline: none; border-color: var(--accent); }

/* calculator */
.study-tools { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.calculator-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; transition: border-color 0.2s var(--ease-smooth), background-color 0.2s var(--ease-smooth); }
.calculator-toggle:hover { border-color: var(--accent); background: var(--panel-hover); }
.calculator-popup { position: fixed; right: 20px; bottom: 20px; z-index: 1000; width: min(320px, calc(100vw - 24px)); padding: 16px; border: 1px solid var(--border); border-radius: 22px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); animation: modalAppear 0.3s var(--ease-smooth) forwards; }
.calculator-popup[hidden] { display: none; }
.calculator-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.calculator-header button { border: 0; background: transparent; color: var(--text); font-size: 20px; cursor: pointer; }
.calculator-display { width: 100%; min-width: 0; margin-bottom: 12px; padding: 14px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); text-align: right; font-size: 24px; }
.calculator-keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.calculator-keys button { min-height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font-size: 16px; cursor: pointer; transition: border-color 0.2s var(--ease-smooth), background-color 0.2s var(--ease-smooth); }
.calculator-keys button:hover { border-color: var(--accent); background: var(--panel-hover); }
.calculator-keys button[data-key="="] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ============ RESPONSIVE ============ */
@media (max-width: 760px) {
    .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        transform: translateX(-100%);
        width: 280px;
        min-width: 280px;
        box-shadow: none;
    }
    .sidebar.open { transform: none; box-shadow: 8px 0 40px #00000066; }
    .topbar { display: flex; }
    .chat-area { padding: 20px 13px 16px; }
    .composer-wrap { padding: 6px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .message.user .message-content { max-width: 88%; }
}
@media (max-width: 480px) {
    #studyView { padding: 20px 12px; }
    .study-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .calculator-popup { right: 12px; bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<main id="imageGenPage" style="
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px;
  height: 100vh;
  overflow-y: auto;
">
  <button id="imageBackButton" type="button">← Back</button>

  <h1 style="font-family: Newsreader, Georgia, serif;">
    Image Gen
  </h1>

  <p style="color: var(--muted);">
    Turn your imagination into images.
  </p>

  <form id="imageGenForm">
    <label for="imagePrompt">Describe your image</label>

    <textarea
      id="imagePrompt"
      maxlength="2000"
      required
      placeholder="A glowing blue planet floating in space..."
      style="
        display: block;
        width: 100%;
        min-height: 120px;
        margin: 10px 0;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font: inherit;
        resize: vertical;
      "
    ></textarea>

    <button type="submit" id="generateImageButton"
      style="
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 600;
      ">
      ✨ Generate Image
    </button>
  </form>

  <p id="imageGenStatus" role="status" aria-live="polite"></p>

  <div id="generatedImageArea" hidden style="margin-top: 20px;">
    <img
      id="generatedImage"
      alt="AI-generated image"
      style="
        display: block;
        width: 100%;
        height: auto;
        border-radius: 16px;
        border: 1px solid var(--border);
      "
    >

    <a
      id="downloadGeneratedImage"
      download="lazarus-image.jpg"
      style="
        display: inline-block;
        margin-top: 12px;
        color: var(--text);
      "
    >Download image</a>
  </div>
</main>

<script>

const imageGenForm = document.getElementById("imageGenForm");

imageGenForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const prompt = document.getElementById("imagePrompt").value.trim();
  const button = document.getElementById("generateImageButton");
  const status = document.getElementById("imageGenStatus");
  const area = document.getElementById("generatedImageArea");
  const image = document.getElementById("generatedImage");
  const download = document.getElementById("downloadGeneratedImage");

  if (!prompt) return;

  button.disabled = true;
  button.textContent = "Generating...";
  status.textContent = "Creating your image. This may take a moment.";
  area.hidden = true;

  try {
    const response = await fetch(
      "https://lazarus-image-gen.narayangill8.workers.dev/generate",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      }
    );

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.error || "Image generation failed.");
    }

    const blob = await response.blob();

    if (!blob.type.startsWith("image/")) {
      throw new Error("The server did not return an image.");
    }

    const imageUrl = URL.createObjectURL(blob);
    image.src = imageUrl;
    download.href = imageUrl;

    area.hidden = false;
    status.textContent = "Your image is ready!";
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "✨ Generate Image";
  }
});

// Logic update snippet for handling display name and anti-impersonation
function processMessage(userMessage, displayName) {
    const lowerMsg = userMessage.toLowerCase();
    const cleanName = (displayName || "").trim().toLowerCase();
    
    // Check if user is trying to claim they created Lazarus while using a shared name like Xavier
    if ((cleanName === "xavier" || cleanName === "notanaidev") && 
        (lowerMsg.includes("i made you") || lowerMsg.includes("i created you") || lowerMsg.includes("my creation"))) {
        return `Hey ${displayName}! While it's cool that you're using that display name, you didn't actually create me—the real developer built me. But it's great to chat with you!`;
    }
    return null;
}
</script>
</body>
</html>
