<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0b12">
<title>Lazarus AI</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --bg: #0c0b12;
    --sidebar: #100e18;
    --panel: #171421;
    --panel-hover: #211b30;
    --text: #f7f5fc;
    --muted: #a39bb5;
    --border: #292337;
    --accent: #a78bfa;
    --accent-strong: #8b5cf6;
    --bubble: #1c1728;
    --input: #15121f;
    --code: #090909;
    --err: #ff8a8a;
    --font-size: 16px;
    --shadow: 0 10px 45px #0005;
}

body.light {
    color-scheme: light;
    --bg: #f8f7fc;
    --sidebar: #f0edf7;
    --panel: #fff;
    --panel-hover: #eae5f6;
    --text: #211a30;
    --muted: #746b83;
    --border: #ded7ea;
    --accent: #8055d9;
    --accent-strong: #7142ce;
    --bubble: #eee8f8;
    --input: #fff;
    --code: #e4e4e4;
    --err: #c0392b;
    --shadow: 0 10px 35px #47335b12;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg);
    color: var(--text);
    font: var(--font-size)/1.6 Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
}

button, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

.logo { font-family: Newsreader, Georgia, serif; font-size: 22px; letter-spacing: .01em; }
.logo i { color: var(--accent); }

.app { display: flex; height: 100dvh; width: 100%; }

/* SIDEBAR */
.sidebar {
    position: relative;
    z-index: 10;
    width: 265px;
    min-width: 265px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
    overflow: hidden;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    transition: width .22s ease, min-width .22s ease, transform .2s;
}

.sidebar.collapsed {
    width: 70px;
    min-width: 70px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    min-height: 48px;
    padding: 5px;
    margin-bottom: 12px;
    border: 0;
    border-radius: 12px;
    color: var(--text);
    background: transparent;
    text-align: left;
    white-space: nowrap;
}

.brand:hover { background: var(--panel-hover); }

.brand-icon {
    width: 39px;
    height: 39px;
    flex: 0 0 39px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    color: white;
    font-size: 22px;
    background: linear-gradient(140deg, #c4a5ff, #7c3aed);
    box-shadow: 0 0 24px #9b6cff36;
}

.sidebar.collapsed .brand-name,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .history-heading,
.sidebar.collapsed .history-list,
.sidebar.collapsed .sidebar-footer-label,
.sidebar.collapsed .me small,
.sidebar.collapsed .me button:not(#gear) { display: none; }

.sidebar.collapsed .brand { justify-content: center; }
.sidebar.collapsed .nav-button { justify-content: center; padding: 10px 0; }
.sidebar.collapsed .me { justify-content: center; padding: 10px 0; }

.nav { display: grid; gap: 5px; }

.nav-button {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--text);
    text-align: left;
    white-space: nowrap;
}

.nav-button:hover, .nav-button.active { background: var(--panel-hover); }

.nav-icon {
    width: 24px;
    min-width: 24px;
    display: grid;
    place-items: center;
    font-size: 19px;
}

.nav-label { overflow: hidden; text-overflow: ellipsis; }

.history-heading {
    padding: 0 11px;
    margin: 20px 0 9px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
}

.history-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }

.history-item { display: flex; align-items: center; gap: 3px; margin: 2px 0; }

.history-open {
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
}

.history-open:hover, .history-open.selected { background: var(--panel-hover); color: var(--text); }

.history-delete {
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    padding: 5px 8px;
    opacity: 0;
}
.history-item:hover .history-delete { opacity: 1; }
.history-delete:hover { color: #ff7777; background: var(--panel-hover); }

.empty-history { padding: 10px; color: var(--muted); font-size: 13px; }

.me {
    border-top: 1px solid var(--border);
    padding: 12px 6px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: auto;
}

.av {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent, #111);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
}

.me small { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
.me button { background: none; border: 0; color: var(--muted); font-size: 13px; }
.me button:hover { color: var(--text); }

/* MAIN AREA + PURPLE HAZE */
.main {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 53% 30%, #8b5cf610 0%, transparent 44%),
        var(--bg);
}

.main::before {
    content: "";
    position: absolute;
    z-index: 0;
    pointer-events: none;
    width: 650px;
    height: 450px;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    background: #8247f30c;
    filter: blur(100px);
    border-radius: 50%;
}

.topbar {
    position: relative;
    z-index: 1;
    height: 62px;
    flex: 0 0 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
    background: #0c0b1280;
    backdrop-filter: blur(16px);
}

body.light .topbar { background: #f8f7fccc; }

.topbar-left, .topbar-actions { display: flex; align-items: center; gap: 10px; }
.topbar-title { font-weight: 650; font-size: 15px; }
.status { color: var(--muted); font-size: 12px; }

.icon-button {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    background: var(--panel);
}
.icon-button:hover { background: var(--panel-hover); }

.chat-area {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    padding: 32px 22px 24px;
}

.messages { width: min(790px, 100%); margin: 0 auto; }

.welcome {
    min-height: 46vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px 12px;
}

.welcome-logo {
    width: 62px;
    height: 62px;
    display: grid;
    place-items: center;
    margin-bottom: 22px;
    border-radius: 21px;
    color: white;
    font-size: 29px;
    background: linear-gradient(145deg, #c4a5ff, #7c3aed);
    box-shadow: 0 0 55px #8b5cf64a;
}

.welcome h1 {
    margin: 0 0 9px;
    font-family: Newsreader, Georgia, serif;
    font-size: clamp(27px, 4vw, 38px);
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: -.02em;
}

.welcome p { margin: 0; color: var(--muted); font-size: 15px; }

.sug { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.sug button { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; color: var(--muted); font-size: 13px; }
.sug button:hover { color: var(--text); border-color: var(--accent); background: var(--panel-hover); }

.message {
    display: flex;
    gap: 13px;
    align-items: flex-start;
    margin-bottom: 27px;
    animation: appear .18s ease-out;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar {
    width: 33px;
    height: 33px;
    flex: 0 0 33px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: var(--panel-hover);
    font-size: 15px;
    font-weight: 700;
}

.message.assistant .avatar {
    color: white;
    background: linear-gradient(145deg, #a78bfa, #6d28d9);
}

.message.user .avatar { display: none; }

.message-content {
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
    line-height: 1.75;
    flex: 1;
}

.message.user { justify-content: flex-end; }

.message.user .message-content {
    max-width: min(80%, 610px);
    padding: 12px 16px;
    border: 1px solid #a78bfa1f;
    border-radius: 19px 19px 5px 19px;
    background: var(--bubble);
    white-space: pre-wrap;
}

/* Markdown styling inside assistant messages */
.message-content p { margin: 0 0 .8em; }
.message-content pre { background: var(--code); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 13px; }
.message-content code { font-family: ui-monospace, Menlo, monospace; font-size: .92em; }
.message-content :not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 5px; }
.message-content ul, .message-content ol { padding-left: 22px; margin: 0 0 .8em; }
.message-content h3, .message-content h2, .message-content h1 { font-family: Newsreader, serif; font-weight: 500; margin: .8em 0 .4em; }

.message-content img {
    display: block;
    max-width: min(100%, 330px);
    max-height: 280px;
    object-fit: contain;
    margin-top: 10px;
    border-radius: 12px;
}

.imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.imgs img { max-width: 220px; max-height: 220px; border-radius: 10px; object-fit: cover; display: block; }

.act { display: flex; gap: 4px; margin-top: 6px; }
.ab { display: flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); padding: 5px 8px; border-radius: 8px; font-size: 13px; }
.ab:hover { background: var(--panel-hover); color: var(--text); }
.ab.on { color: var(--text); }

.dots::after {
    content: "●";
    color: var(--accent);
    animation: pulse 1s infinite alternate;
}

@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }

/* MESSAGE COMPOSER */
.composer-wrap {
    position: relative;
    z-index: 1;
    padding: 12px 22px max(17px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 20%);
}

.composer {
    width: min(790px, 100%);
    margin: 0 auto;
    padding: 10px 12px 10px 16px;
    border: 1px solid #8b5cf641;
    border-radius: 24px;
    background: var(--input);
    box-shadow: 0 0 35px #8b5cf60a, var(--shadow);
    transition: border-color .2s, box-shadow .2s;
}

.composer:focus-within {
    border-color: #a78bfa8a;
    box-shadow: 0 0 35px #8b5cf61c, var(--shadow);
}

#messageInput {
    display: block;
    width: 100%;
    min-height: 43px;
    max-height: 180px;
    resize: none;
    overflow-y: auto;
    border: 0;
    outline: 0;
    padding: 9px 2px;
    color: var(--text);
    background: transparent;
    line-height: 1.55;
}

#messageInput::placeholder { color: var(--muted); }

.composer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.composer-tools { display: flex; align-items: center; gap: 8px; min-width: 0; }

.ib {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    background: none;
    color: var(--muted);
    display: grid;
    place-items: center;
    flex-shrink: 0;
}
.ib:hover { color: var(--text); background: var(--panel-hover); }
.ib.on { color: var(--on-accent, #111); background: var(--accent); }
#mic.on { animation: pulse 1s infinite; }

.send-button {
    min-width: 43px;
    height: 41px;
    padding: 0 15px;
    border: 0;
    border-radius: 14px;
    color: white;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
    font-weight: 750;
    transition: filter .2s, transform .2s;
}

.send-button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
.send-button:disabled { opacity: .55; cursor: wait; }

#thumbs { max-width: 790px; margin: 0 auto 8px; display: flex; gap: 10px; flex-wrap: wrap; }
.th { position: relative; width: 60px; height: 60px; }
.th img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.th button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent, #111); font-size: 11px; line-height: 20px; padding: 0; }

#spkbar { max-width: 790px; margin: 0 auto 8px; text-align: center; }
#spkbar button { background: var(--panel); border: 1px solid var(--accent); color: var(--text); border-radius: 999px; padding: 6px 16px; font-size: 13px; }

.small-note {
    margin: 9px 0 0;
    color: var(--muted);
    text-align: center;
    font-size: 11px;
}

/* SETTINGS MODAL / PANEL */
#set {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
    z-index: 100;
    padding: 20px;
}
#set .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow);
}
#set .row { display: flex; justify-content: space-between; align-items: center; }
#set h2 { margin: 0; font: 500 24px Newsreader, Georgia, serif; }
#set .row button { background: none; border: 0; color: var(--muted); font-size: 18px; }
#set label { color: var(--muted); font-size: 13px; margin-top: 6px; font-weight: 600; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--panel-hover); }
.seg button { flex: 1; background: none; border: 0; padding: 10px; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--on-accent, #111); font-weight: 600; }
.nrow { display: flex; gap: 8px; }
#dn { flex: 1; min-width: 0; background: var(--input); border: 1px solid var(--border); border-radius: 11px; padding: 10px 12px; color: var(--text); font: inherit; }
#dn:focus { border-color: var(--accent); outline: none; }
#dsavae, #asave { background: var(--accent); color: var(--on-accent, #111); border: 0; border-radius: 11px; padding: 0 16px; font-weight: 600; }
#dmsg { min-height: 20px; font-size: 13px; color: var(--muted); }
#dmsg.bad { color: var(--err); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--panel-hover); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 13px; }
.chips button:hover { color: var(--text); }
.chips button.on { background: var(--accent); color: var(--on-accent, #111); border-color: var(--accent); font-weight: 600; }
#about { background: var(--input); border: 1px solid var(--border); border-radius: 11px; padding: 10px 12px; color: var(--text); font: inherit; resize: vertical; min-height: 72px; }
#about:focus { border-color: var(--accent); outline: none; }
.nrow2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
#amsg { font-size: 13px; color: var(--muted); }
#amsg.bad { color: var(--err); }

/* AUTH OVERLAY */
#auth {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: grid;
    place-items: center;
    z-index: 200;
    padding: 20px;
}
#auth form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
#auth .logo { font-size: 40px; text-align: center; }
#auth p.s { text-align: center; color: var(--muted); margin: -6px 0 8px; font-size: 14px; }
#auth input { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font: inherit; }
#auth input:focus { border-color: var(--accent); outline: none; }
#auth .go { background: var(--accent); color: var(--on-accent, #111); border: 0; border-radius: 12px; padding: 12px; font-weight: 600; }
#auth .alt { background: none; border: 0; color: var(--muted); font-size: 13px; }
#err { color: var(--err); min-height: 20px; font-size: 13px; text-align: center; }

.mobile-overlay { display: none; }

@media (max-width: 760px) {
    .sidebar {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        width: 70px;
        min-width: 70px;
        box-shadow: var(--shadow);
        transform: translateX(-100%);
    }
    .sidebar.open { transform: none; }

    .sidebar:not(.expanded) .brand-name,
    .sidebar:not(.expanded) .nav-label,
    .sidebar:not(.expanded) .history-heading,
    .sidebar:not(.expanded) .history-list,
    .sidebar:not(.expanded) .sidebar-footer-label,
    .sidebar:not(.expanded) .me small,
    .sidebar:not(.expanded) .me button:not(#gear) { display: none; }

    .sidebar.expanded { width: min(280px, 84vw); min-width: min(280px, 84vw); transform: none; }
    .sidebar.expanded .brand-name,
    .sidebar.expanded .nav-label,
    .sidebar.expanded .history-heading,
    .sidebar.expanded .history-list,
    .sidebar.expanded .sidebar-footer-label,
    .sidebar.expanded .me small,
    .sidebar.expanded .me button { display: block; }
    .sidebar.expanded .me { display: flex; }

    .mobile-overlay.show {
        display: block;
        position: fixed;
        z-index: 9;
        inset: 0;
        background: #0008;
        backdrop-filter: blur(2px);
    }

    .topbar { padding: 0 16px; }
    .chat-area { padding: 22px 13px 20px; }
    .composer-wrap { padding: 8px 10px 12px 10px; }
}
</style>
</head>

<body>
<div id="auth" hidden>
  <form id="af">
    <div class="logo">Laz<i>a</i>rus</div>
    <p class="s" id="at">Sign in to pick up where you left off</p>
    <input id="un" type="text" placeholder="Username (what Lazarus calls you)" maxlength="30" autocomplete="username" hidden>
    <input id="em" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
    <div id="err"></div>
    <button class="go" id="ab">Sign in</button>
    <button class="alt" type="button" id="sw">New here? Create an account</button>
    <button class="alt" type="button" id="gs">Continue as guest</button>
  </form>
</div>

<div id="set" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="st">
    <div class="row"><h2 id="st">Settings</h2><button id="sx" aria-label="Close settings">✕</button></div>
    <label>Theme</label>
    <div class="seg" id="seg"><button data-t="dark">Dark</button><button data-t="light">Light</button><button data-t="system">System</button></div>
    <label for="dn">What Lazarus calls you</label>
    <div class="nrow"><input id="dn" maxlength="30" autocomplete="off"><button id="dsave">Save</button></div>
    <div id="dmsg" role="status"></div>
    <label>Personality</label>
    <div class="chips" id="pers"><button data-p="default">Default</button><button data-p="friendly">Friendly</button><button data-p="professional">Professional</button><button data-p="witty">Witty</button><button data-p="direct">Direct</button><button data-p="nerdy">Nerdy</button></div>
    <label>Response length</label>
    <div class="seg" id="lens"><button data-l="short">Short</button><button data-l="balanced">Balanced</button><button data-l="detailed">Detailed</button></div>
    <label for="about">Anything else Lazarus should know or do</label>
    <textarea id="about" maxlength="500" placeholder="e.g. I'm learning Spanish. Explain things with examples."></textarea>
    <div class="nrow2"><span id="amsg" role="status"></span><button id="asave">Save</button></div>
  </div>
</div>

<div class="app">
    <div id="mobileOverlay" class="mobile-overlay"></div>

    <aside id="sidebar" class="sidebar">
        <button class="brand" id="sidebarToggle" title="Expand or collapse sidebar" aria-label="Toggle sidebar">
            <span class="brand-icon">✦</span>
            <span class="brand-name logo">Laz<i>a</i>rus</span>
        </button>

        <nav class="nav">
            <button class="nav-button" id="newChatButton" title="New chat">

/* Markdown parser helper */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(src) {
  const blocks = [];
  let t = esc(src || '').replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_, l, c) => { blocks.push('<pre><code>' + c.replace(/\n$/,'') + '</code></pre>'); return '\u0000' + (blocks.length-1) + '\u0000'; });
  t = t.split(/\n{2,}/).map(p => {
    if (/^\u0000\d+\u0000$/.test(p.trim())) return p.trim();
    if (/^#{1,3} /.test(p)) return p.replace(/^#{1,3} (.*)$/, '<h3>$1</h3>');
    if (/^(\s*[-*] .*(\n|$))+$/.test(p)) return '<ul>' + p.trim().split('\n').map(l => '<li>' + l.replace(/^\s*[-*] /,'') + '</li>').join('') + '</ul>';
    if (/^(\s*\d+\. .*(\n|$))+$/.test(p)) return '<ol>' + p.trim().split('\n').map(l => '<li>' + l.replace(/^\s*\d+\. /,'') + '</li>').join('') + '</ol>';
    return '<p>' + p.replace(/\n/g,'<br>') + '</p>';
  }).join('');
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* Voice and Audio synthesis */
const synth = window.speechSynthesis;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, spkBtn = null, listening = false, speakTok = 0, pending = 0, handsFree = false, micSend = false;

const cleanText = t => t.replace(/```[\s\S]*?(```|$)/g, ' Code block. ').replace(/`/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_#>|~]+/g, '').replace(/[ \t]+/g, ' ');

function updateBtns() {
  document.querySelectorAll('.spk').forEach(b => {
    const on = b === spkBtn && pending > 0;
    b.classList.toggle('on', on);
    b.lastChild.textContent = on ? 'Stop' : 'Listen';
  });
  $("mic").classList.toggle('on', listening);
  $("spkbar").hidden = pending <= 0;
}

function stopSpeak() {
  speakTok++;
  pending = 0;
  if (synth) synth.cancel();
  updateBtns();
}

function afterSpeak() {
  updateBtns();
  if (handsFree && !ctrl && !listening) startListen();
}

function speakChunk(txt, tok) {
  const t = txt.trim();
  if (!synth || !t || tok !== speakTok) return;
  const u = new SpeechSynthesisUtterance(t);
  pending++;
  updateBtns();
  u.onend = u.onerror = () => {
    if (tok !== speakTok) return;
    pending--;
    if (pending <= 0) {
      pending = 0;
      afterSpeak();
    }
  };
  synth.speak(u);
}

function feed(st, text, final, tok) {
  let rest = text.slice(st.i), m;
  const re = /^[\s\S]*?([.!?:;]+["')\]]*\s|\n)/;
  while ((m = re.exec(rest))) {
    speakChunk(m[0], tok);
    st.i += m[0].length;
    rest = rest.slice(m[0].length);
  }
  if (final && rest.trim()) {
    speakChunk(rest, tok);
    st.i = text.length;
  }
}

function startListen() {
  if (!SR) { alert('Speech recognition is not supported in this browser. Try Chrome, Edge or Safari.'); return; }
  if (ctrl) ctrl.abort();
  stopSpeak();
  if (listening) return;
  const r = rec = new SR();
  r.lang = navigator.language || 'en-US';
  r.interimResults = true;
  r.continuous = false;
  const base = $("messageInput").value ? $("messageInput").value + ' ' : '';
  let fin = '';
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const x = e.results[i];
      if (x.isFinal) fin += x[0].transcript;
      else interim += x[0].transcript;
    }
    $("messageInput").value = base + fin + interim;
    $("messageInput").style.height = 'auto';
    $("messageInput").style.height = Math.min($("messageInput").scrollHeight, 180) + 'px';
  };
  r.onend = () => {
    listening = false;
    updateBtns();
    if (!r._cancel && $("messageInput").value.trim()) {
      micSend = true;
      sendMessage();
    }
  };
  r.onerror = e => { if (e.error === 'not-allowed') alert('Allow microphone access to talk to Lazarus.'); };
  r.start();
  listening = true;
  updateBtns();
}

function stopListen(abort) {
  if (!rec) return;
  rec._cancel = !!abort;
  abort ? rec.abort() : rec.stop();
}

function speakMsg(t, btn) {
  const was = btn.classList.contains('on');
  stopSpeak();
  if (was) return;
  handsFree = false;
  spkBtn = btn;
  feed({ i: 0 }, cleanText(t._raw || t.innerText), true, speakTok);
  updateBtns();
}

async function copyText(s, b) {
  try { await navigator.clipboard.writeText(s); }
  catch {
    const a = document.createElement('textarea');
    a.value = s;
    document.body.appendChild(a);
    a.select();
    document.execCommand('copy');
    a.remove();
  }
  const l = b.lastChild;
  l.textContent = 'Copied';
  setTimeout(() => l.textContent = 'Copy', 1500);
}

/* Image attachment handlers */
let pend = [];
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image.')); };
    img.src = url;
  });
}

async function addFiles(files) {

    try { pend.push(await shrink(f)); } catch (e) { alert(e.message); }
  }
  renderThumbs();
}

function apiMessages() {
  let budget = 3;
  const recent = cur.messages.slice(-30);
  const out = recent.map((m, i) => {
    const fromEnd = recent.length - 1 - i;
    if (m.role === 'user' && m.images && m.images.length && fromEnd < 8) return { m, imgs: m.images };
    return { m, imgs: [] };
  }).reverse().map(({ m, imgs }) => {
    if (imgs.length && budget > 0) {
      const use = imgs.slice(0, budget);
      budget -= use.length;
      return { role: 'user', content: [{ type: 'text', text: m.content || 'What is in this image?' }, ...use.map(u => ({ type: 'image_url', image_url: { url: u } }))] };
    }
    return { role: m.role, content: m.content || (m.images && m.images.length ? '[photo]' : ' ') };
  }).reverse();
  return [{ role: 'system', content: sysPrompt() }, ...out];
}

async function sendMessage(regenIndex = null) {
  if (ctrl) {
    ctrl.abort();
    stopSpeak();
    return;
  }
  stopSpeak();
  if (listening) stopListen(true);
  handsFree = micSend;
  micSend = false;

  const regenerating = Number.isInteger(regenIndex);
  const input = $("messageInput");
  const text = input.value.trim();

  if (!regenerating && !text && !pend.length) {
    input.focus();
    return;
  }

  if (!cur) newChat();

  if (regenerating) {
    if (regenIndex < 0 || regenIndex >= cur.messages.length || cur.messages[regenIndex].role !== 'assistant') return;
    cur.messages = cur.messages.slice(0, regenIndex);
  } else {
    if (cur.messages.length === 0) {
      cur.title = text.length > 36 ? text.slice(0, 36).trimEnd() + "…" : (text || "Photo");
    }
    cur.messages.push({ role: 'user', content: text, ...(pend.length ? { images: [...pend] } : {}) });
    pend = [];
    renderThumbs();
    input.value = "";
    input.style.height = "auto";
  }

  renderHistory();
  renderMessages();

  const out = bubble('assistant', '', null, cur.messages.length);
  let acc = '';
  ctrl = new AbortController();
  $("sendButton").disabled = true;
  $("sendButton").textContent = "■";
  $("connectionStatus").textContent = "Thinking…";

  const tok = speakTok, st = { i: 0 };

  try {
    const response = await sb('/functions/v1/groq-chat', {
      method: 'POST',
      signal: ctrl.signal,
      body: JSON.stringify({ messages: apiMessages() })
    });

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error?.message || `Request failed (${response.status}).`);
    }

    const rd = response.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data: ') || l.includes('[DONE]')) continue;
        try {
          const d = JSON.parse(l.slice(6)).choices[0].delta.content;
          if (d) {
            acc += d;
            out._raw = acc;
            out.innerHTML = md(acc);
            $("chatView").scrollTop = $("chatView").scrollHeight;
            if (handsFree) feed(st, cleanText(acc), false, tok);
          }
        } catch {}
      }
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      console.error("Lazarus chat error:", error);
      acc += (acc ? '\n\n' : '') + "Error: " + error.message;
      out._raw = acc;
      out.innerHTML = md(acc);
    }
  }

  if (!acc) {
    out.innerHTML = '<p style="color:var(--muted)">Stopped.</p>';
  } else {
    out.parentElement.querySelector('.act').hidden = false;
  }

  if (acc) {
    cur.messages.push({ role: 'assistant', content: acc });
    const regenBtn = out.parentElement.querySelector('.regen');
    if (regenBtn) regenBtn.dataset.index = cur.messages.length - 1;
  }

  if (handsFree && acc) feed(st, cleanText(acc), true, tok);

  ctrl = null;
  $("sendButton").disabled = false;
  $("sendButton").textContent = "↑";
  $("connectionStatus").textContent = "Online";

  cur.updatedAt = Date.now();
  chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  Store.save(cur);
  renderHistory();
  input.focus();
}

/* Settings and User Management */
async function loadName() {
  prefs = Object.assign({ personality: 'default', length: 'balanced', about: '' }, LS.get('lz_prefs_' + user.id, {}));
  if (user.guest) return LS.get('lz_guest_name', '');
  if (!useSB) return LS.get('lz_name_' + user.id, '');
  try {
    const r = await sb('/rest/v1/profiles?select=display_name,settings&user_id=eq.' + user.id);
    const j = r.ok ? await r.json() : [];
    if (j[0] && j[0].settings && Object.keys(j[0].settings).length) prefs = Object.assign(prefs, j[0].settings);
    return (j[0] && j[0].display_name) || '';
  } catch { return ''; }
}

async function savePrefs() {
  LS.set('lz_prefs_' + user.id, prefs);
  if (user.guest || !useSB) return true;
  try {
    const r = await sb('/rest/v1/profiles?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: user.id, settings: prefs, updated_at: new Date().toISOString() }) });
    return r.ok;
  } catch { return false; }
}

function markPrefs() {
  document.querySelectorAll('#pers button').forEach(b => b.classList.toggle('on', b.dataset.p === prefs.personality));
  document.querySelectorAll('#lens button').forEach(b => b.classList.toggle('on', b.dataset.l === prefs.length));
}

function refreshWho() {
  const n = prefName || (user.guest ? 'Guest' : (user.email ? user.email.split('@')[0] : 'User'));
  $("who").textContent = n;
  $("av").textContent = n[0].toUpperCase();
}

async function persistName(v) {
  if (user.guest || !useSB) {
    if (v && reserved(v)) throw new Error('That name is reserved.');
    LS.set(user.guest ? 'lz_guest_name' : 'lz_name_' + user.id, v);
    return;
  }
  const r = await sb('/rest/v1/profiles?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: user.id, display_name: v || null, updated_at: new Date().toISOString() }) });
  if (r.status === 409) throw new Error('That name is already taken.');
  if (!r.ok) throw new Error('Could not save. Try again.');
}

const mq = matchMedia('(prefers-color-scheme: light)');
function markTheme() {
  const m = LS.get('lz_theme', 'dark');
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === m));
  $("themeQuickButton").textContent = (m === 'light' || (m === 'system' && mq.matches)) ? '☾' : '☼';
}

function applyTheme(m) {
  LS.set('lz_theme', m);
  const light = m === 'light' || (m === 'system' && mq.matches);
  document.body.classList.toggle('light', light);
  markTheme();
}

mq.addEventListener('change', () => {
  if (LS.get('lz_theme', 'dark') === 'system') applyTheme('system');
});

function openSettings() {
  const d = defName(user);
  $("dn").value = prefName;
  $("dn").placeholder = d && !reserved(d) ? d : 'Your name';
  $("dmsg").textContent = '';
  $("dmsg").className = '';
  $("amsg").textContent = '';
  $("about").value = prefs.about || '';
  markPrefs();
  markTheme();
  $("set").hidden = false;
  $("dn").focus();
}

function isMobile() {
  return window.matchMedia("(max-width: 760px)").matches;
}

function toggleSidebar() {
  const sidebar = $("sidebar");
  if (isMobile()) {
    sidebar.classList.toggle("expanded");
    sidebar.classList.toggle("open");
    $("mobileOverlay").classList.toggle("show", sidebar.classList.contains("open"));
  } else {
    sidebar.classList.toggle("collapsed");
  }
}

function closeMobileSidebar() {
  if (!isMobile()) return;
  $("sidebar").classList.remove("expanded", "open");
  $("mobileOverlay").classList.remove("show");
}

async function enter(u) {
  user = u;
  $("auth").hidden = true;
  prefName = await loadName();
  refreshWho();
  $("out").textContent = u.guest ? 'Sign in' : 'Sign out';
  chats = await Store.load();
  cur = chats[0] || null;
  renderHistory();
  renderMessages();
}

/* Event Listeners Setup */
$("sidebarToggle").addEventListener("click", toggleSidebar);
$("menuToggle").addEventListener("click", toggleSidebar);
$("mobileOverlay").addEventListener("click", closeMobileSidebar);
$("newChatButton").addEventListener("click", newChat);
$("settingsNavButton").addEventListener("click", openSettings);
$("gear").addEventListener("click", openSettings);
$("sx").addEventListener("click", () => $("set").hidden = true);
$("set").addEventListener("click", e => { if (e.target === $("set")) $("set").hidden = true; });

$("themeQuickButton").addEventListener("click", () => {
  const current = LS.get('lz_theme', 'dark');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

$("out").addEventListener("click", async () => {
  if (ctrl) ctrl.abort();
  if (user.guest) { $("auth").hidden = false; return; }
  Auth.out();
  await enter(GUEST);
});

$("gs").addEventListener("click", () => $("auth").hidden = true);

$("af").onsubmit = async e => {
  e.preventDefault();
  $("err").textContent = '';
  $("ab").disabled = true;
  try {
    const un = $("un").value.trim();
    if (signup && (un.length < 2 || un.length > 30)) throw new Error('Pick a username between 2 and 30 characters.');
    await enter(await Auth.login($("em").value.trim().toLowerCase(), $("pw").value, signup, un));
    $("pw").value = '';
  } catch (x) {
    $("err").textContent = x.message;
  }
  $("ab").disabled = false;
};

$("sw").onclick = () => {
  signup = !signup;
  $("err").textContent = '';
  $("un").hidden = !signup;
  $("un").required = signup;
  $("ab").textContent = signup ? 'Create account' : 'Sign in';
  $("sw").textContent = signup ? 'Have an account? Sign in' : 'New here? Create an account';
  $("at").textContent = signup ? 'Create an account to save your chats' : 'Sign in to pick up where you left off';
  $("pw").autocomplete = signup ? 'new-password' : 'current-password';
};

$("seg").addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) applyTheme(b.dataset.t);
});

$("pers").addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  prefs.personality = b.dataset.p;
  markPrefs();
  savePrefs();
});

$("lens").addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  prefs.length = b.dataset.l;
  markPrefs();
  savePrefs();
});

$("asave").onclick = async () => {
  prefs.about = $("about").value.trim().slice(0, 500);
  const ok = await savePrefs(), m = $("amsg");
  m.className = ok ? '' : 'bad';
  m.textContent = ok ? 'Saved.' : 'Saved locally. Could not sync.';
};

$("dsave").onclick = async () => {
  const v = $("dn").value.trim().slice(0, 30), m = $("dmsg");
  m.className = '';
  m.textContent = '';
  try {
    await persistName(v);
    prefName = v;
    refreshWho();
    if (!cur || !cur.messages.length) renderMessages();
    m.textContent = v ? `Saved. Lazarus will call you ${v}.` : 'Cleared to default name.';
  } catch (e) {
    m.className = 'bad';
    m.textContent = e.message;
  }
};

$("att").onclick = () => $("file").click();
$("file").onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$("messageInput").addEventListener('paste', e => {
  const fs = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));
  if (fs.length) { e.preventDefault(); addFiles(fs); }
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const fs = [...((e.dataTransfer && e.dataTransfer.files) || [])];
  if (fs.length) addFiles(fs);
});

$("mic").onclick = () => { if (listening) stopListen(); else startListen(); };
$("spstop").onclick = stopSpeak;

$("messages").addEventListener('click', e => {
  const b = e.target.closest('.ab');
  if (!b) return;
  const t = b.closest('.message-content').querySelector('.t');
  if (b.classList.contains('copy')) copyText(t._raw || t.innerText, b);
  else if (b.classList.contains('regen')) sendMessage(Number(b.dataset.index));
  else speakMsg(t, b);
});

$("sendButton").addEventListener('click', () => sendMessage());

$("messageInput").addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});

$("messageInput").addEventListener('input', () => {
  if (pending > 0) stopSpeak();
  const input = $("messageInput");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    stopSpeak();
    if (listening) stopListen(true);
    $("set").hidden = true;
  }
});

/* Initialize Application */
applyTheme(LS.get('lz_theme', 'dark'));
Auth.restore().then(u => enter(u || GUEST)).catch(() => enter(GUEST));
</script>
</body>
</html>
