
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Lazarus AI</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0d0d0d;
  --panel:#151515;
  --line:#2a2a2a;
  --text:#ececec;
  --mute:#8d8d8d;
  --accent:#e6e6e6;
  --user:#232323;
  --on-accent:#111;
  --code:#090909;
  --err:#ff8a8a;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f5f5f5;
  --panel:#ebebeb;
  --line:#d4d4d4;
  --text:#171717;
  --mute:#6a6a6a;
  --accent:#171717;
  --user:#dedede;
  --on-accent:#f5f5f5;
  --code:#e4e4e4;
  --err:#c0392b;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.6 Inter,system-ui,sans-serif;
  display:flex;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo{font:500 24px Newsreader,Georgia,serif}
.logo i{color:var(--accent)}
button svg{pointer-events:none}

/* Sidebar */
#side{
  width:268px;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:14px 10px;
  gap:10px;
  flex-shrink:0;
}
.top{display:flex;align-items:center;padding:0 6px}
.new{
  border:1px solid var(--line);
  background:transparent;
  border-radius:10px;
  padding:9px 12px;
  text-align:left;
}
.new:hover,.item:hover{background:var(--user)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.item{
  display:flex;
  align-items:center;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  color:var(--mute);
  gap:6px;
  min-width:0;
}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.on{background:var(--user);color:var(--text)}
.item button{background:none;border:0;color:var(--mute);padding:0 4px}
.me{
  border-top:1px solid var(--line);
  padding:10px 6px 0;
  display:flex;
  align-items:center;
  gap:8px;
}
.av{
  width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:600;flex-shrink:0;
}
.me small{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.me button{background:none;border:0;color:var(--mute);font-size:12px}

/* Main chat */
main{
  flex:1;display:flex;flex-direction:column;
  min-width:0;padding-top:env(safe-area-inset-top,0);
}
header{
  display:none;padding:10px 14px;border-bottom:1px solid var(--line);
  align-items:center;gap:10px;
}
header button{background:none;border:0;font-size:20px}
#msgs{flex:1;overflow:auto;padding:24px 16px;overscroll-behavior:contain}
.wrap{max-width:740px;margin:0 auto}
.m{margin-bottom:22px;display:flex;gap:12px;min-width:0}
.m.user{justify-content:flex-end}
.m.user .b{
  background:var(--user);border-radius:14px;padding:9px 14px;
  max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;
}
.m.ai .b{flex:1;min-width:0;overflow-wrap:anywhere}
.b p{margin:0 0 .8em}
.b p:last-child{margin-bottom:0}
.b pre{
  background:var(--code);border:1px solid var(--line);
  border-radius:10px;padding:12px;overflow-x:auto;font-size:13px;
}
.b code{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.b :not(pre)>code{background:var(--code);padding:1px 5px;border-radius:5px}
.b ul,.b ol{padding-left:22px;margin:0 0 .8em}
.b h3,.b h2,.b h1{font:500 22px Newsreader,serif;margin:.8em 0 .4em}
.dots:after{content:"●";animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
.act{display:flex;gap:4px;margin:7px 0 0 -8px;flex-wrap:wrap}
.ab{
  display:flex;align-items:center;gap:6px;background:none;border:0;
  color:var(--mute);padding:5px 8px;border-radius:8px;font-size:13px;
}
.ab:hover{background:var(--user);color:var(--text)}
.ib{
  width:36px;height:36px;border-radius:50%;border:0;background:none;
  color:var(--mute);display:grid;place-items:center;flex-shrink:0;
}
.ib:hover{color:var(--text)}
.ib.on{color:var(--on-accent);background:var(--accent)}
#mic.on{animation:p 1s infinite}
#empty{
  min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:6px;
}
#empty .logo{font-size:44px}
#empty p{color:var(--mute);margin:0}
.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.sug button{
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;color:var(--mute);
}
.sug button:hover{color:var(--text);border-color:var(--accent)}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.imgs img{max-width:220px;max-height:220px;border-radius:10px;object-fit:cover}

/* Composer */
#comp{padding:0 16px calc(14px + env(safe-area-inset-bottom,0))}
#box{
  max-width:740px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;
  display:flex;align-items:flex-end;padding:8px;gap:8px;
}
#box:focus-within{border-color:var(--accent)}
#in{
  flex:1;min-width:0;background:none;border:0;color:var(--text);
  font:inherit;resize:none;max-height:200px;padding:6px 4px;outline:none;
}
#send{
  width:36px;height:36px;border-radius:50%;border:0;
  background:var(--accent);color:var(--on-accent);font-size:16px;flex-shrink:0;
}
.note{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
#thumbs{max-width:740px;margin:0 auto 8px;display:flex;gap:10px;flex-wrap:wrap}
.th{position:relative;width:60px;height:60px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.th button{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;
  border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);
  font-size:11px;padding:0;
}
#spkbar{max-width:740px;margin:0 auto 8px;text-align:center}
#spkbar button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px}

/* Authentication */
#auth{
  position:fixed;inset:0;background:var(--bg);display:grid;
  place-items:center;z-index:20;padding:20px;overflow:auto;
}
#auth form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#auth .logo{font-size:40px;text-align:center}
#auth p.s{text-align:center;color:var(--mute);margin:-6px 0 8px}
#auth input{
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;color:var(--text);font:inherit;
}
#auth .go{
  background:var(--accent);color:var(--on-accent);border:0;
  border-radius:10px;padding:11px;font-weight:600;
}
#auth .alt{background:none;border:0;color:var(--mute)}
#err{color:var(--err);min-height:20px;font-size:13px;text-align:center}

/* Settings */
#set{
  position:fixed;inset:0;background:#0009;display:grid;
  place-items:center;z-index:12;padding:20px;
}
#set .card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;
  gap:10px;max-height:90vh;overflow:auto;
}
#set .row{display:flex;justify-content:space-between;align-items:center}
#set h2{margin:0;font:500 22px Newsreader,Georgia,serif}
#set .row button{background:none;border:0;color:var(--mute)}
#set label{color:var(--mute);font-size:13px;margin-top:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:8px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.nrow{display:flex;gap:8px}
#dn{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;color:var(--text);
}
#dsave,#asave{
  background:var(--accent);color:var(--on-accent);border:0;
  border-radius:10px;padding:8px 16px;font-weight:600;
}
#dmsg,#amsg{min-height:20px;font-size:13px;color:var(--mute)}
.bad{color:var(--err)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;color:var(--mute);
}
.chips button.on{background:var(--accent);color:var(--on-accent)}
#about{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;color:var(--text);font:inherit;resize:vertical;min-height:72px;
}
.nrow2{display:flex;justify-content:space-between;align-items:center;gap:8px}

@media(max-width:760px){
  #side{
    position:fixed;inset:0 auto 0 0;z-index:15;
    transform:translateX(-105%);transition:transform .2s;
    box-shadow:none;
  }
  #side.open{transform:translateX(0);box-shadow:8px 0 40px #0004}
  header{display:flex}
  #msgs{padding:18px 12px}
  #comp{padding-left:10px;padding-right:10px}
  .m.user .b{max-width:92%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div id="auth" hidden>
  <form id="af">
    <div class="logo">Laz<i>a</i>rus</div>
    <p class="s" id="at">Sign in to pick up where you left off</p>
    <input id="un" type="text" placeholder="Username" maxlength="30" autocomplete="username" hidden>
    <input id="em" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
    <div id="err" role="status"></div>
    <button class="go" id="ab" type="submit">Sign in</button>
    <button class="alt" type="button" id="sw">New here? Create an account</button>
    <button class="alt" type="button" id="gs">Continue as guest</button>
  </form>
</div>

<div id="set" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="st">
    <div class="row"><h2 id="st">Settings</h2><button id="sx" aria-label="Close settings">✕</button></div>
    <label>Theme</label>
    <div class="seg" id="seg">
      <button data-t="dark">Dark</button><button data-t="light">Light</button><button data-t="system">System</button>
    </div>
    <label for="dn">What Lazarus calls you</label>
    <div class="nrow"><input id="dn" maxlength="30" autocomplete="off"><button id="dsave">Save</button></div>
    <div id="dmsg" role="status"></div>
    <label>Personality</label>
    <div class="chips" id="pers">
      <button data-p="default">Default</button><button data-p="friendly">Friendly</button>
      <button data-p="professional">Professional</button><button data-p="witty">Witty</button>
      <button data-p="direct">Direct</button><button data-p="nerdy">Nerdy</button>
    </div>

      <button data-l="short">Short</button><button data-l="balanced">Balanced</button><button data-l="detailed">Detailed</button>
    </div>

    <textarea id="about" maxlength="500" placeholder="e.g. I'm learning Spanish. Explain things with examples."></textarea>
    <div class="nrow2"><span id="amsg" role="status"></span><button id="asave">Save</button></div>
  </div>
</div>

<aside id="side">
  <div class="top"><span class="logo">Laz<i>a</i>rus</span></div>
  <button class="new" id="nw">+ New chat</button>
  <div id="list"></div>
  <div class="me">
    <div class="av" id="av">G</div><small id="who">Guest</small>
    <button id="gear" title="Settings" aria-label="Settings">⚙</button>
    <button id="out">Sign in</button>
  </div>
</aside>

<main>
  <header><button id="menu" aria-label="Open menu">☰</button><span class="logo">Laz<i>a</i>rus</span></header>
  <div id="msgs"><div class="wrap" id="thread"></div></div>
  <div id="comp">
    <div id="thumbs" hidden></div>
    <div id="spkbar" hidden><button id="spstop">■ Stop speaking</button></div>
    <div id="box">
      <button class="ib" id="att" title="Attach photos" aria-label="Attach photos">＋</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <textarea id="in" rows="1" placeholder="Message Lazarus" aria-label="Message Lazarus"></textarea>
      <button class="ib" id="mic" title="Speak your message" aria-label="Speak your message">🎙</button>
      <button id="send" aria-label="Send">↑</button>
    </div>
    <div class="note">Lazarus can make mistakes. Check important information.</div>
  </div>
</main>

<script>
"use strict";

/* ---------- Configuration ---------- */
const CFG = {
  SB_URL: "https://gkoullazvjzzgbpvuchw.supabase.co",
  SB_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdrb3VsbGF6dmp6emdicHZ1Y2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MjgxMzIsImV4cCI6MjEwNzMwNDEzMn0.ovH0g9TjDKQLeln-D2Ar-Lq4RogyciIP08UuFXKwg0o",
  API_URL: "https://lazarus-backend-0umw.onrender.com",
  SYSTEM: "You are Lazarus, a helpful, clear and honest AI assistant created by Notanaidev and Xavier. If anyone asks who created you, say Notanaidev and Xavier. Use Markdown when useful."
};

const $ = id => document.getElementById(id);
const GUEST = {id:"guest",email:"",guest:true};
let user = null, chats = [], cur = null, ctrl = null, signup = false;
let prefName = "", pend = [];
let prefs = {personality:"default",length:"balanced",about:""};
let listening = false, rec = null, speakTok = 0, spkBtn = null;
let pendingSpeech = 0;

const LS = {
  get(k,d=null){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
};
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random();
const reserved = n => ["xavier","notanaidev"].includes(String(n).toLowerCase().replace(/[^a-z0-9]/g,""));
const defName = u => u && !u.guest && u.email ? u.email.split("@")[0] : "";
const nameOf = () => prefName || (reserved(defName(user)) ? "" : defName(user));

const PERS = {
  default:"",
  friendly:"Be warm, friendly and encouraging.",
  professional:"Be professional, polished and precise.",
  witty:"Use light humor when appropriate.",
  direct:"Be direct and avoid unnecessary filler.",
  nerdy:"Be curious and explain how things work."
};
const LENS = {
  short:"Keep answers short unless more detail is requested.",
  balanced:"",
  detailed:"Give detailed answers with useful examples."
};
function sysPrompt(){
  return [
    CFG.SYSTEM,
    nameOf() ? "The user's name is "+nameOf()+"." : "",
    PERS[prefs.personality] || "",
    LENS[prefs.length] || "",
    prefs.about ? "Additional user preferences: "+prefs.about : ""
  ].filter(Boolean).join(" ");
}

/* ---------- Supabase ---------- */
async function sb(path,opt={},retry=true){
  const session=LS.get("lz_session");
  const headers={
    apikey:CFG.SB_ANON,
    "Content-Type":"application/json",
    Authorization:"Bearer "+(session?.access_token || CFG.SB_ANON),
    ...(opt.headers||{})
  };
  const response=await fetch(CFG.SB_URL+path,{...opt,headers});
  if(response.status===401 && retry && session?.refresh_token){
    const refresh=await fetch(CFG.SB_URL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",
      headers:{apikey:CFG.SB_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:session.refresh_token})
    });
    if(refresh.ok){
      LS.set("lz_session",await refresh.json());
      return sb(path,opt,false);
    }
  }
  return response;
}

const Auth={
  async login(email,password,create,username){
    const path=create?"/auth/v1/signup":"/auth/v1/token?grant_type=password";
    const body=create
      ? {email,password,data:{username}}
      : {email,password};
    const r=await sb(path,{method:"POST",body:JSON.stringify(body)},false);
    const data=await r.json().catch(()=>({}));
    if(!r.ok){
      throw new Error(data.msg||data.message||data.error_description||"Authentication failed.");
    }
    if(!data.access_token){
      throw new Error("Check your email for a confirmation link, then sign in.");
    }
    LS.set("lz_session",data);
    return {id:data.user.id,email:data.user.email};
  },
  async restore(){
    const s=LS.get("lz_session");
    if(!s?.access_token)return null;
    const r=await sb("/auth/v1/user");
    if(!r.ok)return null;
    const u=await r.json();
    return {id:u.id,email:u.email};
  },
  out(){
    localStorage.removeItem("lz_session");
  }
};

/* ---------- Chat storage ---------- */
const Store={
  async load(){
    if(user.guest)return LS.get("lz_chats_guest",[]);
    const r=await sb("/rest/v1/chats?select=id,title,messages,updated_at&order=updated_at.desc");
    if(!r.ok)return [];
    const data=await r.json();
    return Array.isArray(data)?data:[];
  },
  async save(chat){
    chat.updated_at=new Date().toISOString();
    if(user.guest){
      LS.set("lz_chats_guest",chats);
      return;
    }
    const r=await sb("/rest/v1/chats?on_conflict=id",{
      method:"POST",
      headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({
        id:chat.id,user_id:user.id,title:chat.title,
        messages:chat.messages,updated_at:chat.updated_at
      })
    });
    if(!r.ok)console.warn("Chat sync failed:",await r.text());
  },
  async del(id){
    if(user.guest){
      LS.set("lz_chats_guest",chats);
      return;
    }
    await sb("/rest/v1/chats?id=eq."+encodeURIComponent(id),{method:"DELETE"});
  }
};

/* ---------- Safe Markdown renderer ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function md(source){
  const blocks=[];
  let text=esc(source);
  text=text.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    blocks.push("<pre><code>"+code.replace(/\n$/,"")+"</code></pre>");
    return "\u0000"+(blocks.length-1)+"\u0000";
  });
  text=text.split(/\n{2,}/).map(part=>{
    const p=part.trim();
    if(/^\u0000\d+\u0000$/.test(p))return p;
    if(/^#{1,3}\s/.test(p))return p.replace(/^#{1,3}\s+(.*)$/,"<h3>$1</h3>");
    if(/^(\s*[-*]\s+.*(\n|$))+$/.test(part)){
      return "<ul>"+part.trim().split("\n").map(x=>"<li>"+x.replace(/^\s*[-*]\s+/,"")+"</li>").join("")+"</ul>";
    }
    if(/^(\s*\d+\.\s+.*(\n|$))+$/.test(part)){
      return "<ol>"+part.trim().split("\n").map(x=>"<li>"+x.replace(/^\s*\d+\.\s+/,"")+"</li>").join("")+"</ol>";
    }
    return "<p>"+p.replace(/\n/g,"<br>")+"</p>";
  }).join("");
  text=text.replace(/`([^`\n]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  return text.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[Number(i)]);
}

/* ---------- Chat rendering ---------- */
function renderList(){
  $("list").replaceChildren();
  chats.forEach(chat=>{
    const row=document.createElement("div");
    row.className="item"+(cur?.id===chat.id?" on":"");
    const title=document.createElement("span");
    title.textContent=chat.title||"New chat";
    const del=document.createElement("button");
    del.textContent="×";
    del.title="Delete chat";
    del.setAttribute("aria-label","Delete chat");
    row.append(title,del);
    row.onclick=()=>{
      if(ctrl)return;
      cur=chat;
      renderThread();
      renderList();
      $("side").classList.remove("open");
    };
    del.onclick=async e=>{
      e.stopPropagation();
      if(ctrl)return;
      chats=chats.filter(c=>c.id!==chat.id);
      await Store.del(chat.id);
      if(cur?.id===chat.id)cur=null;
      renderThread();
      renderList();
    };
    $("list").appendChild(row);
  });
}

function createAction(label,action){
  const b=document.createElement("button");
  b.className="ab "+action;
  b.textContent=label;
  return b;
}

function bubble(role,text,images=[],index=-1){
  const row=document.createElement("div");
  row.className="m "+role;
  const body=document.createElement("div");
  body.className="b";

  if(role==="user"){
    images.forEach(url=>{
      const img=new Image();
      img.src=url;
      img.alt="Attached photo";
      img.loading="lazy";
      const holder=document.createElement("div");
      holder.className="imgs";
      holder.appendChild(img);
      body.appendChild(holder);
    });
    if(text)body.appendChild(document.createTextNode(text));
    row.appendChild(body);
    $("thread").appendChild(row);
    return body;
  }

  const content=document.createElement("div");
  content.className="t";
  content._raw=text||"";
  content.innerHTML=text?md(text):'<span class="dots"></span>';
  const actions=document.createElement("div");
  actions.className="act";
  actions.hidden=!text;

  const copy=createAction("Copy","copy");
  const regen=createAction("Regenerate","regen");
  const listen=createAction("Listen","spk");
  regen.dataset.index=index;
  actions.append(copy,regen,listen);
  body.append(content,actions);
  row.appendChild(body);
  $("thread").appendChild(row);

  content._act=actions;
  return content;
}

function renderThread(){
  $("thread").replaceChildren();
  if(!cur||!cur.messages?.length){
    const empty=document.createElement("div");
    empty.id="empty";
    const logo=document.createElement("div");
    logo.className="logo";
    logo.innerHTML="Laz<i>a</i>rus";
    const greeting=document.createElement("p");
    greeting.textContent=nameOf()?"Hi "+nameOf()+". What should we bring back to life today?":"What should we bring back to life today?";
    const suggestions=document.createElement("div");
    suggestions.className="sug";
    [
      "Explain how a CPU works",
      "Help me write a story",
      "Debug my JavaScript",
      "Plan a weekend trip"
    ].forEach(value=>{
      const b=document.createElement("button");
      b.textContent=value;
      b.onclick=()=>{$("in").value=value;send();};
      suggestions.appendChild(b);
    });
    empty.append(logo,greeting,suggestions);
    $("thread").appendChild(empty);
    return;
  }

  cur.messages.forEach((message,index)=>{
    bubble(message.role==="user"?"user":"ai",message.content||"",message.images||[],index);
  });
  $("msgs").scrollTop=$("msgs").scrollHeight;
}

function setBusy(busy){
  $("send").textContent=busy?"■":"↑";
  $("send").setAttribute("aria-label",busy?"Stop generating":"Send");
  $("in").disabled=busy;
  $("att").disabled=busy;
}

/* ---------- Render API connection ---------- */
async function send(regenIndex=null){
  if(ctrl){
    ctrl.abort();
    return;
  }

  stopSpeak();

  const regenerating=Number.isInteger(regenIndex);
  const text=$("in").value.trim();

  if(!regenerating&&!text&&!pend.length)return;

  // The current backend expects text, not image attachments.
  // Keep the selected photos rather than silently discarding them.
  if(pend.length){
    alert("Photo uploads are not supported by the current Render backend yet. Remove the photos or wait until image support is added.");
    return;
  }

  if(user.guest){
    $("auth").hidden=false;
    $("err").textContent="Sign in to send messages to Lazarus.";
    return;
  }

  const session=LS.get("lz_session");
  if(!session?.access_token){
    $("auth").hidden=false;
    $("err").textContent="Your session has expired. Please sign in again.";
    return;
  }

  if(!cur){
    cur={id:uid(),title:"New chat",messages:[]};
    chats.unshift(cur);
  }

  if(regenerating){
    if(regenIndex<0||regenIndex>=cur.messages.length||cur.messages[regenIndex].role!=="assistant")return;
    cur.messages=cur.messages.slice(0,regenIndex);
  }else{
    if(!cur.messages.length)cur.title=text.slice(0,40)||"New chat";
    cur.messages.push({role:"user",content:text});
    $("in").value="";
    $("in").style.height="auto";
  }

  const lastUserIndex=cur.messages.findLastIndex(m=>m.role==="user");
  if(lastUserIndex<0)return;

  const message=cur.messages[lastUserIndex].content;
  const history=cur.messages.slice(0,lastUserIndex)
    .filter(m=>["user","assistant"].includes(m.role)&&typeof m.content==="string")
    .slice(-12)
    .map(m=>({role:m.role,content:m.content}));

  renderThread();
  renderList();

  const output=bubble("ai","",[],cur.messages.length);
  let answer="";
  ctrl=new AbortController();
  setBusy(true);

  try{
    const response=await fetch(CFG.API_URL+"/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+session.access_token
      },
      body:JSON.stringify({message,history}),
      signal:ctrl.signal
    });

    const data=await response.json().catch(()=>({}));
    if(!response.ok){
      if(response.status===401||response.status===403){
        throw new Error("Authentication failed. Check your Supabase settings on Render and sign in again.");
      }
      throw new Error(data.error||data.message||"Request failed ("+response.status+").");
    }
    if(!data.success||typeof data.reply!=="string"){
      throw new Error(data.error||"The server returned an unexpected response.");
    }

    answer=data.reply.trim();
    output._raw=answer;
    output.innerHTML=md(answer);
    output._act.hidden=!answer;
  }catch(error){
    if(error.name!=="AbortError"){
      answer="Error: "+error.message;
      output._raw=answer;
      output.innerHTML=md(answer);
      output._act.hidden=true;
    }
  }

  if(answer&&!answer.startsWith("Error: ")){
    cur.messages.push({role:"assistant",content:answer});
    const regen=output._act.querySelector(".regen");
    if(regen)regen.dataset.index=String(cur.messages.length-1);
  }else if(!answer){
    output.innerHTML='<p style="color:var(--mute)">Generation stopped.</p>';
  }

  ctrl=null;
  setBusy(false);
  renderList();
  renderThread();
  await Store.save(cur);
}

/* ---------- Theme and settings ---------- */
const mq=matchMedia("(prefers-color-scheme: light)");

function applyTheme(theme){
  LS.set("lz_theme",theme);
  document.documentElement.dataset.theme=
    theme==="system"?(mq.matches?"light":"dark"):theme;
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===theme));
}
mq.addEventListener?.("change",()=>{
  if(LS.get("lz_theme","dark")==="system")applyTheme("system");
});

function markPrefs(){
  document.querySelectorAll("#pers button").forEach(b=>b.classList.toggle("on",b.dataset.p===prefs.personality));
  document.querySelectorAll("#lens button").forEach(b=>b.classList.toggle("on",b.dataset.l===prefs.length));
}

function refreshWho(){
  const label=prefName||(user.guest?"Guest":user.email||"User");
  $("who").textContent=label;
  $("av").textContent=(label[0]||"G").toUpperCase();
  $("out").textContent=user.guest?"Sign in":"Sign out";
}

async function loadName(){
  prefs=Object.assign(
    {personality:"default",length:"balanced",about:""},
    LS.get("lz_prefs_"+user.id,{})
  );

  if(user.guest){
    prefName=LS.get("lz_guest_name","");
    return;
  }

  try{
    const r=await sb("/rest/v1/profiles?select=display_name,settings&user_id=eq."+encodeURIComponent(user.id));
    if(!r.ok)return;
    const rows=await r.json();
    if(rows[0]){
      prefName=rows[0].display_name||"";
      if(rows[0].settings)prefs=Object.assign(prefs,rows[0].settings);
    }
  }catch(error){
    console.warn("Could not load profile settings.",error);
  }
}

async function savePrefs(){
  LS.set("lz_prefs_"+user.id,prefs);
  if(user.guest)return true;

  try{
    const r=await sb("/rest/v1/profiles?on_conflict=user_id",{
      method:"POST",
      headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({
        user_id:user.id,
        settings:prefs,
        updated_at:new Date().toISOString()
      })
    });
    return r.ok;
  }catch{return false;}
}

function openSet(){
  $("dn").value=prefName;
  $("dmsg").textContent="";
  $("amsg").textContent="";
  $("about").value=prefs.about||"";
  markPrefs();
  applyTheme(LS.get("lz_theme","dark"));
  $("set").hidden=false;
}

async function saveName(){
  const value=$("dn").value.trim().slice(0,30);
  const status=$("dmsg");
  status.className="";
  status.textContent="";

  if(value&&reserved(value)){
    status.className="bad";
    status.textContent="That name is reserved.";
    return;
  }

  if(user.guest){
    LS.set("lz_guest_name",value);
  }else{
    const r=await sb("/rest/v1/profiles?on_conflict=user_id",{
      method:"POST",
      headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({
        user_id:user.id,
        display_name:value||null,
        updated_at:new Date().toISOString()
      })
    });
    if(!r.ok){
      status.className="bad";
      status.textContent="Could not save. Check your Supabase profiles table.";
      return;
    }
  }

  prefName=value;
  refreshWho();
  if(!cur||!cur.messages.length)renderThread();
  status.textContent=value?"Saved. Lazarus will call you "+value+".":"Name cleared.";
}

/* ---------- Voice ---------- */
const synth=window.speechSynthesis;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function stopSpeak(){
  speakTok++;
  pendingSpeech=0;
  if(synth)synth.cancel();
  $("spkbar").hidden=true;
  document.querySelectorAll(".spk").forEach(b=>{
    b.classList.remove("on");
    b.textContent="Listen";
  });
}

function speakText(text,button){
  const was=button.classList.contains("on");
  stopSpeak();
  if(was||!synth)return;

  const token=speakTok;
  const utterance=new SpeechSynthesisUtterance(
    String(text).replace(/```[\s\S]*?```/g,"Code block").replace(/[`*_#>|~]/g,"")
  );
  button.classList.add("on");
  button.textContent="Stop";
  $("spkbar").hidden=false;

  utterance.onend=()=>{
    if(token!==speakTok)return;
    button.classList.remove("on");
    button.textContent="Listen";
    $("spkbar").hidden=true;
  };
  utterance.onerror=()=>{
    if(token!==speakTok)return;
    button.classList.remove("on");
    button.textContent="Listen";
    $("spkbar").hidden=true;
  };
  synth.speak(utterance);
}

function startListen(){
  if(!SR){
    alert("Speech recognition is not supported in this browser. Try Chrome, Edge, or Safari.");
    return;
  }
  if(listening){
    stopListen(true);
    return;
  }

  stopSpeak();
  const recognition=rec=new SR();
  recognition.lang=navigator.language||"en-US";
  recognition.interimResults=true;
  recognition.continuous=false;

  const base=$("in").value;
  let finalText="";
  recognition.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalText+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    $("in").value=[base,finalText,interim].filter(Boolean).join(" ").trim();
    $("in").style.height="auto";
    $("in").style.height=Math.min($("in").scrollHeight,200)+"px";
  };
  recognition.onend=()=>{
    listening=false;
    $("mic").classList.remove("on");
    if(!recognition._cancel&&$("in").value.trim())send();
  };
  recognition.onerror=e=>{
    listening=false;
    $("mic").classList.remove("on");
    if(e.error==="not-allowed")alert("Allow microphone access to use voice input.");
  };

  try{
    recognition.start();
    listening=true;
    $("mic").classList.add("on");
  }catch(error){
    listening=false;
    console.warn(error);
  }
}

function stopListen(cancel=false){
  if(!rec)return;
  rec._cancel=cancel;
  try{cancel?rec.abort():rec.stop();}catch{}
  listening=false;
  $("mic").classList.remove("on");
}

/* ---------- Photo selection ---------- */
function shrink(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,1280/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#fff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg",.8));
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Could not read that image."));
    };
    img.src=url;
  });
}

function renderThumbs(){
  const box=$("thumbs");
  box.replaceChildren();
  box.hidden=!pend.length;

  pend.forEach((url,index)=>{
    const holder=document.createElement("div");
    holder.className="th";
    const img=new Image();
    img.src=url;
    img.alt="Photo selected for attachment";
    const remove=document.createElement("button");
    remove.textContent="×";
    remove.setAttribute("aria-label","Remove photo");
    remove.onclick=()=>{
      pend.splice(index,1);
      renderThumbs();
    };
    holder.append(img,remove);
    box.appendChild(holder);
  });
}

async function addFiles(files){
  for(const file of files){
    if(!file.type.startsWith("image/"))continue;
    if(pend.length>=3){
      alert("You can select up to 3 photos.");
      break;
    }
    try{pend.push(await shrink(file));}
    catch(error){alert(error.message);}
  }
  renderThumbs();
}

/* ---------- App startup ---------- */
async function enter(account){
  user=account;
  $("auth").hidden=true;
  await loadName();
  refreshWho();

  try{chats=await Store.load();}
  catch(error){
    console.error("Could not load chats.",error);
    chats=[];
  }

  chats=Array.isArray(chats)?chats:[];
  cur=null;
  renderThread();
  renderList();
}

$("af").addEventListener("submit",async event=>{
  event.preventDefault();
  $("err").textContent="";
  $("ab").disabled=true;

  try{
    const username=$("un").value.trim();
    if(signup){
      if(username.length<2||username.length>30){
        throw new Error("Choose a username between 2 and 30 characters.");
      }
      if(reserved(username))throw new Error("That username is reserved.");
    }
    const account=await Auth.login(
      $("em").value.trim().toLowerCase(),
      $("pw").value,
      signup,
      username
    );
    $("pw").value="";
    await enter(account);
  }catch(error){
    $("err").textContent=error.message;
  }finally{
    $("ab").disabled=false;
  }
});

$("sw").onclick=()=>{
  signup=!signup;
  $("err").textContent="";
  $("un").hidden=!signup;
  $("un").required=signup;
  $("ab").textContent=signup?"Create account":"Sign in";
  $("sw").textContent=signup?"Have an account? Sign in":"New here? Create an account";
  $("at").textContent=signup?"Create an account to save your chats":"Sign in to pick up where you left off";
  $("pw").autocomplete=signup?"new-password":"current-password";
};

$("gs").onclick=async()=>{
  $("err").textContent="";
  await enter(GUEST);
};

$("out").onclick=async()=>{
  if(ctrl)ctrl.abort();
  stopSpeak();
  stopListen(true);

  if(user.guest){
    $("auth").hidden=false;
    $("err").textContent="";
    return;
  }

  Auth.out();
  await enter(GUEST);
};

$("nw").onclick=()=>{
  if(ctrl)return;
  cur=null;
  renderThread();
  renderList();
  $("side").classList.remove("open");
};

$("menu").onclick=()=>$("side").classList.toggle("open");
$("send").onclick=()=>{
  if(ctrl){ctrl.abort();return;}
  send();
};
$("gear").onclick=openSet;
$("sx").onclick=()=>$("set").hidden=true;

$("set").addEventListener("click",e=>{
  if(e.target===$("set"))$("set").hidden=true;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    $("set").hidden=true;
    $("side").classList.remove("open");
    stopSpeak();
    if(listening)stopListen(true);
  }
});

$("seg").addEventListener("click",e=>{
  const b=e.target.closest("button[data-t]");
  if(b)applyTheme(b.dataset.t);
});

$("pers").addEventListener("click",e=>{
  const b=e.target.closest("button[data-p]");
  if(!b)return;
  prefs.personality=b.dataset.p;
  markPrefs();
  savePrefs();
});

$("lens").addEventListener("click",e=>{
  const b=e.target.closest("button[data-l]");
  if(!b)return;
  prefs.length=b.dataset.l;
  markPrefs();
  savePrefs();
});

$("asave").onclick=async()=>{
  prefs.about=$("about").value.trim().slice(0,500);
  const ok=await savePrefs();
  $("amsg").className=ok?"":"bad";
  $("amsg").textContent=ok?"Saved.":"Could not sync settings. They remain saved on this device.";
};

$("dsave").onclick=saveName;
$("dn").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    saveName();
  }
});

$("att").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  await addFiles([...e.target.files]);
  e.target.value="";
};
$("in").addEventListener("paste",e=>{
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));
  if(files.length){
    e.preventDefault();
    addFiles(files);
  }
});

$("mic").onclick=()=>listening?stopListen(true):startListen();
$("spstop").onclick=stopSpeak;

$("thread").addEventListener("click",async e=>{
  const button=e.target.closest(".ab");
  if(!button)return;

  const textNode=button.closest(".b").querySelector(".t");
  if(button.classList.contains("copy")){
    const text=textNode._raw||textNode.innerText;
    try{
      await navigator.clipboard.writeText(text);
      button.textContent="Copied";
      setTimeout(()=>button.textContent="Copy",1200);
    }catch{
      alert("Could not copy this response.");
    }
  }else if(button.classList.contains("regen")){
    send(Number(button.dataset.index));
  }else if(button.classList.contains("spk")){
    speakText(textNode._raw||textNode.innerText,button);
  }
});

$("in").addEventListener("input",()=>{
  $("in").style.height="auto";
  $("in").style.height=Math.min($("in").scrollHeight,200)+"px";
});
$("in").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    if(ctrl)ctrl.abort();
    else send();
  }
});

applyTheme(LS.get("lz_theme","dark"));

(async()=>{
  try{
    const account=await Auth.restore();
    await enter(account||GUEST);
  }catch(error){
    console.error("Startup error:",error);
    await enter(GUEST);
  }
})();
</script>
